# Streamlit Configuration
# https://docs.streamlit.io/library/advanced-features/configuration

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false  # Hide detailed errors in production
toolbarMode = "minimal"

[runner]
fastReruns = true
